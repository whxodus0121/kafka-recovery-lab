global:
  scrape_interval: 2s
  scrape_timeout: 1s

scrape_configs:
  - job_name: inventory-workers
    static_configs:
      - targets:
          - host.docker.internal:22112
        labels:
          target_role: main
      - targets:
          - host.docker.internal:22113
        labels:
          target_role: retry
      - targets:
          - host.docker.internal:22114
        labels:
          target_role: recovery

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
